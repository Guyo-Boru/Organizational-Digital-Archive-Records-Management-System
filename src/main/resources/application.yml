spring:
  application:
    name: digital-archive-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_archive}
    username: ${DB_USER:archive_app}
    password: ${DB_PASSWORD:archive_app_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'validate' on purpose: your schema is owned by Flyway (V1__init_schema.sql etc.),
      # not by Hibernate. Hibernate should never auto-generate/alter tables here.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Keycloak realm is up and running (see docker-compose.yml) but the app isn't
# validating tokens against it yet — that's Spring Security config, coming next.
# Realm issuer will be: http://localhost:8081/realms/digital-archive

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.security: INFO
    com.digitalarchive: DEBUG

app:
  file-storage:
    location: ${FILE_STORAGE_LOCATION:./uploads}
